services:
  vehicle-loan-app:
    build: .
    image: vehicle-loan-app:latest
    container_name: vehicle-loan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_password}
      - PORT=3000
    volumes:
      # Bind-mount keeps data in ./data/ on the host — visible, easy to back up,
      # and never wiped by `docker compose down` or `docker volume prune`.
      # NEVER add -v to `docker compose down` or the data directory will be deleted.
      - ./data:/app/data
